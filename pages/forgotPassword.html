<!DOCTYPE html>

<html>
    <head>
        <title>Bright Bonds</title>
        <!-- favicon -->
        <link rel="apple-touch-icon" sizes="180x180" href="../favicon_io/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="../favicon_io/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="../favicon_io/favicon-16x16.png">
        <link rel="icon" href="http://www.brightbonds.org/favicon.ico?v=2" />
        <link rel="manifest" href="../favicon_io/site.webmanifest">

        <!-- different size for different device -->
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- stylesheet-->
        <link rel="stylesheet" href="../styles/style.css">

        <!-- Load Amplify from CDN -->
        <script src="https://cdn.jsdelivr.net/npm/aws-amplify@4.3.27/dist/aws-amplify.min.js"></script>
        <!-- script -->
        <script defer src="../js/main.js"></script>   <!-- shared logic -->
        <script defer src="../js/forgotPassword.js"></script>  <!-- forgot password page only -->

        <!-- Nunito Sans, Adamina, Open Sans -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Adamina&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

    </head>


    <body class="gradient">
        <nav>
        <div class="topNavbar">
            <div class="logo">
                <img id="brightbondsimg" src="../brightBondsLogo.PNG" alt="Bright Bonds logo">
                <a id="logoText">Bright Bonds</a>
            </div>

            <!-- "Hamburger menu" to toggle page links -->
            <svg class= "hamburgerMenu" onclick="togglePages()" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewbox="0 0 16 16">
                <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"/>
              </svg>
        </div>

            <div class="menu" id="menu">
                <a class= "page" href="../index.html">Home</a>
                <a class="page" href="aboutUs.html">About Us</a>
                <a class="page" href="logIn.html">Log In</a>
            </div>
        </nav>
        <div class="login">
            <div class="container">
                <h1>
                    Reset Password
                </h1>
                <p>
                    Remember your password? <a href="logIn.html">Log in</a>.
                </p>

                <div id="emailForm">
                    <form id="email_form">
                        <label for="emailInput">Email:</label><br>
                        <input type="email" id="emailInput" required><br>
                        <input type="submit" class="submitButton" value="Send Reset Code">
                    </form>
                </div>

                <div id="resetForm" style="display: none;">
                    <form id="reset_form">
                        <label for="verificationCode">Verification Code:</label><br>
                        <input type="text" id="verificationCode" required><br>
                        <label for="newPassword">New Password:</label><br>
                        <input type="password" id="newPassword" required><br>
                        <input type="submit" class="submitButton" value="Reset Password">
                    </form>
                </div>

                <div id="successMessage" style="display: none;">
                    <p>Password reset successful! You can now log in with your new password.</p>
                    <button class="submitButton" onclick="window.location.href='logIn.html'">Return to Login</button>
                </div>

                <c id="result"></c>
            </div>
        </div>
    </body>
</html>
