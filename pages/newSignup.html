<!DOCTYPE html>

<html>
    <head>
        <title>Bright Bonds</title>
        <!-- favicon -->
        <link rel="apple-touch-icon" sizes="180x180" href="../favicon_io/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="../favicon_io/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="../favicon_io/favicon-16x16.png">
        <link rel="icon" href="http://www.brightbonds.org/favicon.ico?v=2" />
        <link rel="manifest" href="../favicon_io/site.webmanifest">

        <!-- different size for different device -->
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- stylesheet-->
        <link rel="stylesheet" href="../style.css">

        <!-- script -->
        <script src="https://unpkg.com/aws-amplify@6.15.4/dist/aws-amplify.min.js"></script>
        <script src="../script.js" defer></script>

        <!-- Nunito Sans, Adamina, Open Sans -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Adamina&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

    </head>


    <body class="gradient">
        <nav>
            <div class="logo">
                <img id="brightbondsimg" src="../brightBondsLogo.PNG" alt="Bright Bonds logo">
                <a id="logoText">Bright Bonds</a>
            </div>
    
            <!-- "Hamburger menu" to toggle page links -->
            <svg class= "hamburgerMenu" onclick="togglePages()" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewbox="0 0 16 16">
                <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"/>
              </svg>

            <a class= "page" href="../index.html">Home</a>
            <a class="page" href="aboutUs.html">About Us</a>
            <a class="page" id="active" href="logIn.html">Log In</a>
        </nav>
        <h2>Sign Up</h2>
        <input type="text" id="signup-username" placeholder="Username" />
        <input type="password" id="signup-password" placeholder="Password" />
        <input type="email" id="signup-email" placeholder="Email" />
        <button onclick="signUp()">Sign Up</button>

        <h2>Sign In</h2>
        <input type="text" id="signin-username" placeholder="Username" />
        <input type="password" id="signin-password" placeholder="Password" />
        <button onclick="signIn()">Sign In</button>

        <p id="status"></p>

        <script>
  async function signUp() {
    const username = document.getElementById("signup-username").value;
    const password = document.getElementById("signup-password").value;
    const email = document.getElementById("signup-email").value;

    try {
      const { user } = await AWS.Amplify.Auth.signUp({
        username,
        password,
        attributes: { email }
      });
      document.getElementById("status").innerText = "Sign up successful. Check your email to confirm.";
    } catch (error) {
      document.getElementById("status").innerText = "Error: " + error.message;
    }
  }

  async function signIn() {
    const username = document.getElementById("signin-username").value;
    const password = document.getElementById("signin-password").value;

    try {
      const user = await AWS.Amplify.Auth.signIn(username, password);
      document.getElementById("status").innerText = "Signed in successfully as " + user.username;
    } catch (error) {
      document.getElementById("status").innerText = "Error: " + error.message;
    }
  }
</script>

    </body>
</html>
