<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AWS Amplify Auth Test</title>
</head>
<body>
  <h1>Sign Up</h1>
    <input type="text" id="signup-username" placeholder="Username" />
    <input type="password" id="signup-password" placeholder="Password" />
    <input type="email" id="signup-email" placeholder="Email" />
    <input type="text" id="signup-firstname" placeholder="First Name" />
    <input type="text" id="signup-lastname" placeholder="Last Name" />
    <input type="date" id="signup-birthdate" placeholder="Birthdate" />
    <select id="signup-gender">
    <option value="male">Male</option>
    <option value="female">Female</option>
    <option value="other">Other</option>
</select>

  <button onclick="signUp()">Sign Up</button>

  <h1>Sign In</h1>
  <input type="text" id="signin-username" placeholder="Username" />
  <input type="password" id="signin-password" placeholder="Password" />
  <button onclick="signIn()">Sign In</button>

  <p id="status"></p>

  <!-- Load Amplify from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/aws-amplify@4.3.27/dist/aws-amplify.min.js"></script>

  <script>
    window.onload = function () {
      const AmplifyGlobal = window.aws_amplify;

      if (!AmplifyGlobal) {
        document.getElementById("status").innerText = "Amplify failed to load.";
        return;
      }

      const { Amplify, Auth } = AmplifyGlobal;

      Amplify.configure({
        Auth: {
          region: 'us-east-1',
          userPoolId: 'us-east-1_XKYkYd6ID',
          userPoolWebClientId: 'qlnbi35jjb553dgarc2a780p9',
        }
      });
window.signUp = async function () {
  const username = document.getElementById("signup-username").value;
  const password = document.getElementById("signup-password").value;
  const email = document.getElementById("signup-email").value;
  const givenName = document.getElementById("signup-firstname").value;
  const familyName = document.getElementById("signup-lastname").value;
  const birthdate = document.getElementById("signup-birthdate").value;
  const gender = document.getElementById("signup-gender").value;

  try {
    await Auth.signUp({
      username,
      password,
      attributes: {
        email,
        'birthdate': birthdate,
        'gender': gender,
        'given_name': givenName,
        'family_name': familyName,
      }
    });
    document.getElementById("status").innerText = "Signup successful!";
  } catch (err) {
    document.getElementById("status").innerText = "Error: " + err.message;
  }
};


      window.signIn = async function () {
        const username = document.getElementById("signin-username").value;
        const password = document.getElementById("signin-password").value;

        try {
          const user = await Auth.signIn(username, password);
          document.getElementById("status").innerText = "Welcome, " + user.username;
        } catch (err) {
          document.getElementById("status").innerText = "Error: " + err.message;
        }
      };
    };
  </script>
</body>
</html>
