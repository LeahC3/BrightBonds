<!DOCTYPE html>
<html>
<head>
    <title>Bright Bonds - My Matches</title>
    <link rel="apple-touch-icon" sizes="180x180" href="../favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../favicon_io/favicon-16x16.png">
    <link rel="icon" href="http://www.brightbonds.org/favicon.ico?v=2" />
    <link rel="manifest" href="../favicon_io/site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../styles/homeStyle.css">
    <script src="https://cdn.jsdelivr.net/npm/aws-amplify@4.3.27/dist/aws-amplify.min.js"></script>
    <script src="../js/homeMain.js" defer></script>
    <script src="../js/matches.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Adamina&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>

<body class="gradient">
    <div class="container">
        <h1>My Matches</h1>
        
        <div id="loading" style="text-align: center; padding: 2rem;">
            <p>Loading your matches...</p>
        </div>
        
        <div id="no-matches" style="display: none; text-align: center; padding: 2rem;">
            <h2>No Matches Yet</h2>
            <p>We haven't found any matches for you yet. Check back soon!</p>
            <button onclick="runMatching()" class="submitButton">Run Matching Algorithm</button>
        </div>
        
        <div id="matches-container" style="display: none;">
            <div id="matches-list"></div>
        </div>
        
        <div style="text-align: center; margin-top: 2rem;">
            <a href="home.html" class="submitButton" style="text-decoration: none; display: inline-block;">Back to Home</a>
        </div>
    </div>
</body>
</html>
